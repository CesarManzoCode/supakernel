name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm verify:provenance
      - run: corepack pnpm check:boundaries
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm test

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      # Full §31 acceptance matrix, dual-arch build hashes, provenance / SBOM / signature and
      # consumer install from packed tarballs are wired in L14.
      - run: echo "release acceptance audit is implemented in L14"
