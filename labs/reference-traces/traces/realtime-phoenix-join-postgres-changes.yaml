notes: >-
  Behavioural reimplementation; no copied code. Only the join/reply and postgres_changes
  delivery contract is mirrored; Broadcast and Presence are out of scope by contract §5.
summary: >-
  A Phoenix channel join for realtime carries a config.postgres_changes list of
  {event, schema, table, filter}; the join reply echoes each entry with a server-assigned id
  and the client's exact event/schema/table/filter values. Committed row changes on a
  subscribed table are pushed as postgres_changes messages carrying the change type, the new
  and old records and a commit timestamp, in per-connection commit order. A slow consumer is
  bounded: the server drops the connection rather than buffering without limit. SupaKernel
  reproduces the join-reply echo shape, the ordered INSERT/UPDATE/DELETE delivery with the
  realtime-js payload transform, the bounded outbox queue with a system close on overflow,
  and rejects a join that requests Broadcast or Presence with unsupported_feature.
