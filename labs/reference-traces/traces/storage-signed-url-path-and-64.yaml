notes: >-
  Behavioural reimplementation; no copied code. Includes the supabase/storage-js issue #64
  divergence (signedURL field name / path prefix) as a pinned regression.
summary: >-
  storage-js createSignedUrl returns an object whose signedURL is a path beginning with
  /object/sign/<bucket>/<key> plus a token query parameter, and the historical issue #64 is
  that older servers returned the value without the leading path segment, breaking clients
  that concatenate it to the storage base URL. The signed token binds the exact object path
  and method; a GET of the signed path streams the bytes and honours a Range request by
  returning 206 with a Content-Range that concatenates back to the whole object. Delete makes
  the object immediately unreadable. SupaKernel returns the #64-correct signedURL shape
  (field name signedURL, path /object/sign/<bucket>/<key>?token=<jwt>, no /storage/v1
  prefix), verifies the ES256 token's aud/iss and exact path before serving, supports the
  range concatenation property and returns a not-found after delete. URLs and JWTs are
  compared after origin/JWT normalization.
