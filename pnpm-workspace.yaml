# SupaKernel workspace + supply-chain policy.
# Per docs/SupaKernel-Contract.md §33.1: all non-auth pnpm settings live here, not in .npmrc.
packages:
  - "packages/*"
  - "apps/*"
  - "labs/*"

# --- exact versions only; never a range prefix ---
savePrefix: ""
engineStrict: true

# --- supply-chain age gate (contract §33.1) ---
# 4320 minutes = 72 hours. A dependency version younger than this is refused.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Bootstrap exceptions: ONLY `package@exact-version`, never a bare name, wildcard or range.
# Each entry is validated by scripts/verify-provenance.mts against the registry publish
# timestamp and must correspond to a normative pin in the contract. Any future version of
# the same package is subject to the full 72h gate again.
minimumReleaseAgeExclude:
  # Playwright 1.63.0 is a normative contract pin (§33.1) published < 72h before the L0 lock
  # was created. playwright-core is its lockstep internal package at the identical version.
  - "playwright@1.63.0"
  - "playwright-core@1.63.0"
  # jose 6.2.11 is a normative contract pin (§33.1, crypto/JWT) published 2026-09-04T09:36:27Z,
  # ~57h before the lock anchor (2026-09-06T18:36:27Z) — inside the 72h window at lock creation.
  - "jose@6.2.11"

# --- lockfile trust (contract §33.1) ---
trustLockfile: false

# --- dependency build scripts: explicit allowlist only ---
allowBuilds:
  "@biomejs/biome": true
  "esbuild": true
  "@electric-sql/pglite": true
  "libpg-query": true
  "workerd": true
  "@cloudflare/workerd-linux-64": true
